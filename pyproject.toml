[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skiewsql"
version = "0.1.0"
description = "Skill-driven agentic views for complex and recurring Text-to-SQL questions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["skiewsql*", "av_sql*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
