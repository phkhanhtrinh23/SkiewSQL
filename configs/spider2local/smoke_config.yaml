setting_name: s2local_gpt5mini

is_continue_run: True

data_file_path: '/home/trinh/skiew_together/avsql_s2local/smoke.jsonl'
table_file_path: '/home/trinh/skiew_together/avsql_s2local/tables_s2local.json'

dataset_name: "s2local"                 # no "spider2" substring -> standard tables.json branch
tokenizer_name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"

n_runs: 1
n_processes: 1

# SqlExecEnv  (Spider2-lite local = SQLite; flat localdb layout handled natively)
snowflake_credential_path: ""
bigquery_credential_path: ""
sqlite_root_dir: "/mnt/win_d/Multilingual_Text_to_SQL_code_backend/Spider2/spider2-lite/resource/databases/spider2-localdb"

log_dir: "/home/trinh/skiew_together/avsql_s2local/logs_smoke/"

schema_split_type: "prompting_size_limit"
schema_part_token_limit: 20000

is_use_sample_rows: True

value_manager:                          # AV-SQL native LSH value-retrieval, ON
  storage:
    storage_type: "pkl"                 # pure local pickle, no redis/cassandra server
    lsh_dir: "/home/trinh/skiew_together/avsql_s2local/lsh_output/"   # code joins /{db_id}/lsh_index/*.pkl
    hostname: "localhost"               # ignored for pkl
    port: 9042                          # ignored for pkl
  embedding_model:
    embedding_model_type: "local"
    embedding_model_name: 'all-MiniLM-L6-v2'
    device: 'cpu'                       # GPU-free
  lsh_top_k: 5
  lsh_signature_size: 128               # MUST match build
  lsh_n_gram: 3                         # MUST match build
  edit_similarity_threshold: 0.5
  embedding_similarity_threshold: 0.5

rephrase_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  template_path: './prompt_templates/rephrase_question.txt'
  num_incontext_shot: 2
  incontext_shot_folder_path: './prompt_templates/examples/examples_rephrase_question'

cte_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  n_shots: 3
  max_tokens: 4096
  template_path: './prompt_templates/schema_linking_cte_macsql.txt'
  json_type: "multi_table_macsql"
  prompt_type: "compact"
  max_fix_attempt: 5
  run_type: "sequential"
  stream: True
  is_use_col_desc: True
  is_use_sample_rows: True
  num_incontext_shot: 2
  incontext_shot_folder_path: './prompt_templates/examples/example_schema_linking_cte_macsql'

planner_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 4096
  template_path: './prompt_templates/planning.txt'

revise_sql:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 2048
  template_path: './prompt_templates/revise.txt'

sql_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 4096
  template_path: './prompt_templates/zero_shot_with_schemalinking.txt'
  prompt_type: "compact"
  max_fix_attempt: 5
  is_use_col_desc: True
  is_use_sample_rows: True
  stream: True

# python av_sql/main.py --config_file configs/spider2local/gpt5mini_config.yaml
