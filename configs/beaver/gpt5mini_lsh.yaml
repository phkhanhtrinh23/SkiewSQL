setting_name: beaver_gpt5mini_lsh

is_continue_run: True

data_file_path: './data/beaver/beaver_dw.jsonl'
table_file_path: './data/beaver/tables_dw.json'

dataset_name: "beaver"                 # non-spider2 -> standard Spider tables.json branch
tokenizer_name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"

n_runs: 1
n_processes: 1

# SqlExecEnv  (BEAVER = MariaDB on 127.0.0.1:3307, physical db 'dw', root / no password)
snowflake_credential_path: ""
bigquery_credential_path: ""
sqlite_root_dir: ""
mysql_env:
  host: "127.0.0.1"
  port: 3307
  user: "root"
  password: ""

log_dir: "./data/beaver/logs_lsh/"

# DatabaseSchemaManager
schema_split_type: "prompting_size_limit"   # one_table | foreign_key | prompting_size_limit
schema_part_token_limit: 20000              # AV-SQL spider/bird setting -> N>1 chunks on BEAVER

is_use_sample_rows: True

# value_manager intentionally OMITTED (LSH value-retrieval is off and is not required to run)

rephrase_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  template_path: './prompt_templates/rephrase_question.txt'
  num_incontext_shot: 2
  incontext_shot_folder_path: './prompt_templates/examples/examples_rephrase_question'

cte_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  n_shots: 3
  max_tokens: 4096
  template_path: './prompt_templates/schema_linking_cte_macsql.txt'
  json_type: "multi_table_macsql"
  prompt_type: "compact"
  max_fix_attempt: 5
  run_type: "sequential"
  stream: True
  is_use_col_desc: True
  is_use_sample_rows: True
  num_incontext_shot: 2
  incontext_shot_folder_path: './prompt_templates/examples/example_schema_linking_cte_macsql'

planner_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 4096
  template_path: './prompt_templates/planning.txt'

revise_sql:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 2048
  template_path: './prompt_templates/revise.txt'

sql_agent:
  model_name: 'gpt-5-mini'
  temperature: 1.0
  max_tokens: 4096
  template_path: './prompt_templates/zero_shot_with_schemalinking.txt'
  prompt_type: "compact"
  max_fix_attempt: 5
  is_use_col_desc: True
  is_use_sample_rows: True
  stream: True

# python av_sql/main.py --config_file configs/beaver/gpt5mini_config.yaml

value_manager:                          # AV-SQL native LSH value-retrieval (full scan), ON
  storage:
    storage_type: "pkl"
    lsh_dir: "./data/beaver/lsh_output/"
    hostname: "localhost"
    port: 9042
  embedding_model:
    embedding_model_type: "local"
    embedding_model_name: 'all-MiniLM-L6-v2'
    device: 'cpu'
  lsh_top_k: 5
  lsh_signature_size: 128
  lsh_n_gram: 3
  edit_similarity_threshold: 0.5
  embedding_similarity_threshold: 0.5
